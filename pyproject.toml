[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aro-discovery"
version = "2.0.0"
description = "Autoresearcher v2: OGU <-> two-stage ARO bridge, verified mathematical factory, and LearnHarness study bridge"
requires-python = ">=3.12"
dependencies = ["pyyaml"]

[project.scripts]
aro = "learn.push_to_lh:aro_cli"

[tool.setuptools.packages.find]
include = ["learn*"]
exclude = ["learn.tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["corpus", "legacy", "thesis", "verification/lean", "research/literature/exactness-essay"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
