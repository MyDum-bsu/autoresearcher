name: CI

on:
  push:
    branches: [main, master, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-python:
    name: Python Verification & Public Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml sympy pypdf

      - name: Run public hygiene gate (-B and -O)
        run: make verify-public-hygiene

      - name: Run Python deterministic verification suite
        run: |
          make verify-migration
          make verify-corpus
          make verify-m0
          make verify-transfer
          make verify-counterexamples
          make verify-falsifiers
          make verify-lean
          make verify-literature
          make verify-discovery
          python3 -B verification/gates/verify_guides.py --no-style
          python3 -B verification/gates/verify_guides.py --no-style --self-test
          python3 -B -O verification/gates/verify_guides.py --no-style
          python3 -B -O verification/gates/verify_guides.py --no-style --self-test
          make verify-learn

  verify-lean:
    name: Lean 4 Proof Build, Atlas & Gate G2/G3
    runs-on: ubuntu-latest
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (pyyaml, sympy, pypdf)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml sympy pypdf

      - name: Install elan and pinned Lean 4 toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          TOOLCHAIN="$(tr -d '[:space:]' < verification/lean/lean-toolchain)"
          "$HOME/.elan/bin/elan" toolchain install "$TOOLCHAIN"

      - name: Cache Lake packages and Mathlib oleans
        uses: actions/cache@v4
        with:
          path: |
            verification/lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('verification/lean/lean-toolchain', 'verification/lean/lakefile.toml', 'verification/lean/lake-manifest.json') }}

      - name: Hydrate Mathlib cache & build Lean 4 targets (single-threaded)
        working-directory: verification/lean
        run: |
          lake exe cache get || true
          LEAN_NUM_THREADS=1 lake build AroProofs.Inventory BridgeFormalV2.Proofs

      - name: Run Lean 4 compile, Atlas live audit, and Gate G2/G3
        run: |
          LEAN_NUM_THREADS=1 make verify-lean
          LEAN_NUM_THREADS=1 make verify-lean-compile
          LEAN_NUM_THREADS=1 make verify-atlas
          LEAN_NUM_THREADS=1 make verify-claim
